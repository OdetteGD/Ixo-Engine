plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.ixo.engine'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.ixo.engine'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake { path file('../engine/CMakeLists.txt'); version '3.22.1' }
    }

    buildTypes {
        debug { applicationIdSuffix '.debug'; debuggable true }
        release { minifyEnabled false }
    }
}
